<section class="restored_section_team restored_section_menu_repas">
  <div class="container">
    <div class="teaser_title_name">
      <div class="whatsapp-button justify-content-around text-black text-uppercase" onclick="toggleChatBox()"
        id="buton">
        <h6 class="mb-0 d-flex align-items-center" id="text">télécharger le thème</h6>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <path
            d="M288 32c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 242.7-73.4-73.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l128 128c12.5 12.5 32.8 12.5 45.3 0l128-128c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L288 274.7 288 32zM64 352c-35.3 0-64 28.7-64 64l0 32c0 35.3 28.7 64 64 64l384 0c35.3 0 64-28.7 64-64l0-32c0-35.3-28.7-64-64-64l-101.5 0-45.3 45.3c-25 25-65.5 25-90.5 0L165.5 352 64 352zm368 56a24 24 0 1 1 0 48 24 24 0 1 1 0-48z" />
        </svg>
      </div>

      <!-- Bloc de chat avec champ de texte (initialement caché) -->
      <div class="chat-box" id="chatBox">
        <div class="butonclose d-flex justify-content-end">
          <button class="d-flex justify-content-center" onclick="closebox()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
              <path
                d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z" />
            </svg>
          </button>
        </div>
        <h5 class="fw-bold text-black">Options de téléchargement</h5>
        <div class="px-3 mb-3">
          <button class="h6 text-white">Télécharger sans les modules (50Mb)</button>
        </div>
        <div class="px-3">
          <button class="h6 text-white">Télécharger avec les modules (90Mb)</button>
        </div>
      </div>

      <script>
          window.onload = function() {
    // Après 5 secondes (5000 ms), afficher le bouton
    setTimeout(function() {
      document.getElementById('buton').style.display = 'flex';
    }, 5000); // 5000 ms = 5 secondes
  };
        // Fonction pour afficher/masquer la boîte de chat
        function toggleChatBox() {
          const chatBox = document.getElementById('chatBox');
          chatBox.classList.toggle('active');  // Utilisation de toggle() pour alternance de classes
          if (chatBox.classList.contains('active')) {
            document.getElementById('buton').classList.add('rond');
            document.getElementById('text').classList.add('d-none');
          } else {
            document.getElementById('buton').classList.remove('rond');
            document.getElementById('text').classList.remove('d-none');
            console.log('Bonjour');
          }
        }

        // Fonction pour fermer la boîte de chat
        function closebox() {
          document.getElementById('chatBox').classList.remove('active');
          document.getElementById('buton').classList.add('rond');
        }
      </script>
    </div>
  </div>
</section>
